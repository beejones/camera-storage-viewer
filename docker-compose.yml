services:
  # FTP-only container
  ftp:
    x-deploy-role: ftp
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: camera-storage-viewer-ftp
    restart: unless-stopped
    environment:
      # FTP server (camera uploads)
      OUT_DIR: /data
      FTP_BIND_HOST: 0.0.0.0
      FTP_PORT: 21
      FTP_PASSIVE_PORT_MIN: 50000
      FTP_PASSIVE_PORT_MAX: 50003
      FTP_PUBLIC_HOST: ${FTP_PUBLIC_HOST:-}
      FTP_CAMERA_ID: ${FTP_CAMERA_ID:-camera1}
      FTP_USERNAME: ${FTP_USERNAME:-}
      FTP_PASSWORD: ${FTP_PASSWORD:-}
      FTP_USERS_JSON: ${FTP_USERS_JSON:-}
      # Local dev convenience: if no FTP creds are provided, start with camera1/camera1
      FTP_DEV_DEFAULTS: ${FTP_DEV_DEFAULTS:-true}
      # Key Vault URI - set in .env or override at deploy time
      AZURE_KEYVAULT_URI: ${AZURE_KEYVAULT_URI:-}
    volumes:
      # Durable output (mimics Azure Files mount)
      - ./out:/data
      # Local .env for development (production uses Key Vault)
      - ./.env:/app/.env:ro
    ports:
      - "21:21"
      - "50000-50003:50000-50003"
    networks:
      - internal

  web:
    x-deploy-role: app
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: camera-storage-viewer-web
    restart: unless-stopped
    environment:
      OUT_DIR: /data
      WEB_PORT: 8081
      VIEWER_AUTH_TOKEN: ${VIEWER_AUTH_TOKEN:-}
      THUMBNAIL_GENERATION: ${THUMBNAIL_GENERATION:-true}
    volumes:
      - ./out:/data
    command: ["sh", "-lc", "uvicorn src.web_api:app --host 0.0.0.0 --port ${WEB_PORT:-8081}"]
    ports:
      - "8081:8081"
    networks:
      - internal

  # Reverse proxy for the viewer (HTTP/HTTPS termination)
  # Local dev defaults to plain HTTP on :80 unless PUBLIC_DOMAIN is set.
  caddy:
    x-deploy-role: sidecar
    image: ${CADDY_IMAGE:-caddy:2}
    container_name: camera-storage-viewer-caddy
    restart: unless-stopped
    depends_on:
      - web
    entrypoint: ["/bin/sh", "/etc/caddy/caddy_start.sh"]
    environment:
      # If set, Caddy will try to get a real cert for this domain.
      # If unset, Caddy serves HTTP on :80.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      UPSTREAM: web:8081
    volumes:
      - ./docker/caddy_start.sh:/etc/caddy/caddy_start.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
