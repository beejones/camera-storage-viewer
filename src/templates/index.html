<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camera Storage Viewer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/viewer.css?v=2" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar__header">
          <div class="brand">Camera Storage Viewer</div>
          <div class="date">
            <label class="date__label" for="dateInput">Date (UTC)</label>
            <input id="dateInput" class="date__input" type="date" />
          </div>
        </div>

        <div class="sidebar__sectionTitle">Cameras</div>
        <div id="cameraListStatus" class="cameraListStatus" role="status" aria-live="polite"></div>
        <div id="cameraList" class="cameraList" aria-label="Cameras"></div>
      </aside>

      <main class="main">
        <header class="main__header">
          <div>
            <div id="cameraTitle" class="cameraTitle">Select a camera</div>
            <div id="cameraMeta" class="cameraMeta"></div>
          </div>
          <div class="actions">
            <button id="refreshBtn" class="btn">Refresh</button>
          </div>
        </header>

        <section class="stage">
          <video id="player" class="player" controls playsinline></video>
          <div id="emptyState" class="emptyState">Pick a camera and date to browse clips.</div>
        </section>

        <section class="timeline">
          <div class="timeline__header">
            <div class="timeline__title">Timeline</div>
            <div class="timeline__right">
              <label class="timelineScaleSelect" for="timelineScaleSelect">
                <span class="timelineScaleSelect__label">Scale</span>
                <select id="timelineScaleSelect" class="timelineScaleSelect__input">
                  <option value="80">Wide</option>
                  <option value="160">1x</option>
                  <option value="240" selected>2x</option>
                  <option value="360">3x</option>
                  <option value="600">5x</option>
                  <option value="900">7.5x</option>
                  <option value="1200">10x</option>
                </select>
              </label>
              <label class="timelineZoom" for="timelineZoom">
                <span class="timelineZoom__label">Zoom</span>
                <input id="timelineZoom" class="timelineZoom__input" type="range" min="80" max="1200" step="40" value="240" />
              </label>
              <div class="timeline__hint">Click a segment or thumbnail to play. Drag the playhead to scrub.</div>
            </div>
          </div>

          <div id="timelineScroll" class="timelineScroll" aria-label="Timeline">
            <div id="timelineInner" class="timelineInner">
              <div id="timelineScale" class="timelineScale" aria-hidden="true"></div>
              <div id="timelineTrack" class="timelineTrack"></div>
              <div id="timelineFilmstrip" class="timelineFilmstrip" aria-label="Clips"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip" hidden>
      <div id="tooltipTime" class="tooltip__time"></div>
      <img id="tooltipImg" class="tooltip__img" alt="thumbnail" />
    </div>

    <script src="/static/viewer.js?v=2"></script>
  </body>
</html>
